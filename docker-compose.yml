version: '3.9'

services:
  # ========== INFRAESTRUCTURA ==========
  # PostgreSQL para Identity Service
  postgres-identity:
    image: postgres:16-alpine
    container_name: deuna-postgres-identity
    environment:
      POSTGRES_DB: deuna_identity
      POSTGRES_USER: deuna_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deuna_dev_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deuna_user -d deuna_identity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deuna-network

  # PostgreSQL con PostGIS para Orders Service
  postgres-orders:
    image: postgis/postgis:16-3.4-alpine
    container_name: deuna-postgres-orders
    environment:
      POSTGRES_DB: deuna_orders
      POSTGRES_USER: deuna_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deuna_dev_2026}
    ports:
      - "5433:5432"
    volumes:
      - postgres-orders-data:/var/lib/postgresql/data
      - ./scripts/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deuna_user -d deuna_orders"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deuna-network

  # PostgreSQL con PostGIS para Delivery Service (tracking GPS / geography)
  postgres-delivery:
    image: postgis/postgis:16-3.4-alpine
    container_name: deuna-postgres-delivery
    environment:
      POSTGRES_DB: deuna_delivery
      POSTGRES_USER: deuna_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deuna_dev_2026}
    ports:
      - "5434:5432"
    volumes:
      - postgres-delivery-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deuna_user -d deuna_delivery"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deuna-network

  # PostgreSQL para Feedback Service
  postgres-feedback:
    image: postgres:16-alpine
    container_name: deuna-postgres-feedback
    environment:
      POSTGRES_DB: deuna_feedback
      POSTGRES_USER: deuna_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deuna_dev_2026}
    ports:
      - "5435:5432"
    volumes:
      - postgres-feedback-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deuna_user -d deuna_feedback"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deuna-network

  # Redis para tracking GPS y cache
  redis:
    image: redis:7-alpine
    container_name: deuna-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev_2026}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - deuna-network

  # RabbitMQ para mensajería asíncrona
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: deuna-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-deuna}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_dev_2026}
      RABBITMQ_DEFAULT_VHOST: deuna
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - deuna-network

  # ========== MICROSERVICIOS ==========
  gateway:
    build:
      context: .
      dockerfile: Deuna.Gateway/Dockerfile
    container_name: deuna-gateway
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-identity;Port=5432;Database=deuna_identity;Username=deuna_user;Password=${POSTGRES_PASSWORD:-deuna_dev_2026}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-deuna}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-rabbitmq_dev_2026}
      RabbitMQ__VirtualHost: deuna
      Jwt__SecretKey: "DeunaSuperSecretKey2026!@#$%^&*()_+-=[]{}|;:,.<>?"
      Jwt__Issuer: "Deuna.Identity"
      Jwt__Audience: "Deuna.Api"
      # Destinos de los clusters del proxy. En appsettings.json apuntan a
      # http://localhost:500X, que dentro del contenedor del gateway no existe (los
      # servicios escuchan en <servicio>:8080 en la red de Docker). Las claves deben
      # colgar de `ReverseProxy`, que es la sección que enlaza YARP: las anteriores
      # (`Yarp__Clusters__*`, en singular) no se leían nunca y todas las rutas daban 502.
      ReverseProxy__Clusters__identity-cluster__Destinations__identity-service__Address: "http://identity:8080"
      ReverseProxy__Clusters__orders-cluster__Destinations__orders-service__Address: "http://orders:8080"
      ReverseProxy__Clusters__delivery-cluster__Destinations__delivery-service__Address: "http://delivery:8080"
      ReverseProxy__Clusters__feedback-cluster__Destinations__feedback-service__Address: "http://feedback:8080"
    depends_on:
      postgres-identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_started
    networks:
      - deuna-network
    restart: unless-stopped

  identity:
    build:
      context: .
      dockerfile: Deuna.Identity.Service/Dockerfile
    container_name: deuna-identity
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-identity;Port=5432;Database=deuna_identity;Username=deuna_user;Password=${POSTGRES_PASSWORD:-deuna_dev_2026}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-deuna}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-rabbitmq_dev_2026}
      RabbitMQ__VirtualHost: deuna
      Jwt__SecretKey: "DeunaSuperSecretKey2026!@#$%^&*()_+-=[]{}|;:,.<>?"
      Jwt__Issuer: "Deuna.Identity"
      Jwt__Audience: "Deuna.Api"
    depends_on:
      postgres-identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - deuna-network
    restart: unless-stopped

  orders:
    build:
      context: .
      dockerfile: Deuna.Orders.Service/Dockerfile
    container_name: deuna-orders
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-orders;Port=5432;Database=deuna_orders;Username=deuna_user;Password=${POSTGRES_PASSWORD:-deuna_dev_2026}"
      Jwt__SecretKey: "DeunaSuperSecretKey2026!@#$%^&*()_+-=[]{}|;:,.<>?"
      Jwt__Issuer: "Deuna.Identity"
      Jwt__Audience: "Deuna.Api"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-deuna}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-rabbitmq_dev_2026}
      RabbitMQ__VirtualHost: deuna
    depends_on:
      postgres-orders:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - deuna-network
    restart: unless-stopped

  delivery:
    build:
      context: .
      dockerfile: Deuna.Delivery.Service/Dockerfile
    container_name: deuna-delivery
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-delivery;Port=5432;Database=deuna_delivery;Username=deuna_user;Password=${POSTGRES_PASSWORD:-deuna_dev_2026}"
      Jwt__SecretKey: "DeunaSuperSecretKey2026!@#$%^&*()_+-=[]{}|;:,.<>?"
      Jwt__Issuer: "Deuna.Identity"
      Jwt__Audience: "Deuna.Api"
      Redis__Configuration: "redis:6379,password=${REDIS_PASSWORD:-redis_dev_2026}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-deuna}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-rabbitmq_dev_2026}
      RabbitMQ__VirtualHost: deuna
    depends_on:
      postgres-delivery:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - deuna-network
    restart: unless-stopped

  feedback:
    build:
      context: .
      dockerfile: Deuna.Feedback.Service/Dockerfile
    container_name: deuna-feedback
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=postgres-feedback;Port=5432;Database=deuna_feedback;Username=deuna_user;Password=${POSTGRES_PASSWORD:-deuna_dev_2026}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-deuna}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-rabbitmq_dev_2026}
      RabbitMQ__VirtualHost: deuna
    depends_on:
      postgres-feedback:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - deuna-network
    restart: unless-stopped

  # Servicio de métricas: no tiene base propia. Lee las cuatro bases de los otros
  # servicios, una por dominio, con SQL de solo lectura.
  metrics:
    build:
      context: .
      dockerfile: Deuna.Metrics.Service/Dockerfile
    container_name: deuna-metrics
    ports:
      - "5006:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      # Una cadena de conexión por dominio. Cada subservicio recibe solo la suya.
      ConnectionStrings__Pedidos: "Host=postgres-orders;Port=5432;Database=deuna_orders;Username=deuna_user;Password=${POSTGRES_PASSWORD:-deuna_dev_2026}"
      ConnectionStrings__Domiciliarios: "Host=postgres-delivery;Port=5432;Database=deuna_delivery;Username=deuna_user;Password=${POSTGRES_PASSWORD:-deuna_dev_2026}"
      ConnectionStrings__Feedback: "Host=postgres-feedback;Port=5432;Database=deuna_feedback;Username=deuna_user;Password=${POSTGRES_PASSWORD:-deuna_dev_2026}"
      ConnectionStrings__Restaurantes: "Host=postgres-identity;Port=5432;Database=deuna_identity;Username=deuna_user;Password=${POSTGRES_PASSWORD:-deuna_dev_2026}"
      Metricas__ZonaHoraria: "America/Bogota"
      Metricas__MinutosParaConsiderarATiempo: "40"
    depends_on:
      postgres-orders:
        condition: service_healthy
      postgres-delivery:
        condition: service_healthy
      postgres-feedback:
        condition: service_healthy
      postgres-identity:
        condition: service_healthy
    networks:
      - deuna-network
    restart: unless-stopped

volumes:
  postgres-identity-data:
    driver: local
  postgres-orders-data:
    driver: local
  postgres-delivery-data:
    driver: local
  postgres-feedback-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  rabbitmq-log:
    driver: local

networks:
  deuna-network:
    driver: bridge